<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <radialGradient id="meshGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a78bfa" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Pill Gradients -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Dynamic Styles & Keyframe Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.35); opacity: 1; }
      }
      @keyframes swarmDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes rippleRing {
        0% { r: 12px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 52px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes packetTravel {
        0% { offset-distance: 0%; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .node-pulse {
        animation: pulseNode 4s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .mesh-line {
        stroke-dasharray: 6 8;
        animation: swarmDash 25s linear infinite;
      }
      .mesh-line-fast {
        stroke-dasharray: 4 6;
        animation: swarmDash 14s linear infinite reverse;
      }
      .floating-group {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .ripple {
        animation: rippleRing 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .ripple-delayed {
        animation: rippleRing 3.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        animation-delay: 1.75s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#meshGlow)" />

  <!-- DYNAMIC BACKGROUND NETWORK (P2P Swarm Topology) -->
  <g opacity="0.45">
    <!-- Geometric Connection Links -->
    <line x1="80" y1="90" x2="220" y2="160" stroke="#3b82f6" stroke-width="1.5" class="mesh-line" />
    <line x1="220" y1="160" x2="160" y2="290" stroke="#6366f1" stroke-width="1.2" class="mesh-line" />
    <line x1="160" y1="290" x2="310" y2="350" stroke="#8b5cf6" stroke-width="1.2" class="mesh-line-fast" />
    <line x1="220" y1="160" x2="390" y2="110" stroke="#38bdf8" stroke-width="1.2" class="mesh-line" />
    <line x1="390" y1="110" x2="520" y2="70" stroke="#60a5fa" stroke-width="1.2" class="mesh-line" />

    <line x1="1120" y1="100" x2="980" y2="170" stroke="#8b5cf6" stroke-width="1.5" class="mesh-line" />
    <line x1="980" y1="170" x2="1040" y2="300" stroke="#6366f1" stroke-width="1.2" class="mesh-line" />
    <line x1="1040" y1="300" x2="890" y2="350" stroke="#3b82f6" stroke-width="1.2" class="mesh-line-fast" />
    <line x1="980" y1="170" x2="810" y2="120" stroke="#a855f7" stroke-width="1.2" class="mesh-line" />
    <line x1="810" y1="120" x2="680" y2="70" stroke="#c084fc" stroke-width="1.2" class="mesh-line" />

    <!-- Cross Swarm Mesh Ties -->
    <line x1="520" y1="70" x2="680" y2="70" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6" />
    <line x1="310" y1="350" x2="890" y2="350" stroke="#4f46e5" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />

    <!-- Peer Swarm Nodes (Left Swarm) -->
    <circle cx="80" cy="90" r="5" fill="#60a5fa" class="node-pulse" />
    <circle cx="220" cy="160" r="8" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="220" cy="160" r="16" fill="none" stroke="#60a5fa" class="ripple" />
    <circle cx="220" cy="160" r="16" fill="none" stroke="#93c5fd" class="ripple-delayed" />
    <circle cx="160" cy="290" r="6" fill="#818cf8" class="node-pulse" />
    <circle cx="310" cy="350" r="5" fill="#a78bfa" />
    <circle cx="390" cy="110" r="5.5" fill="#38bdf8" class="node-pulse" />
    <circle cx="520" cy="70" r="4.5" fill="#818cf8" />

    <!-- Peer Swarm Nodes (Right Swarm) -->
    <circle cx="1120" cy="100" r="5" fill="#c084fc" class="node-pulse" />
    <circle cx="980" cy="170" r="8" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="980" cy="170" r="16" fill="none" stroke="#a855f7" class="ripple" />
    <circle cx="980" cy="170" r="16" fill="none" stroke="#c084fc" class="ripple-delayed" />
    <circle cx="1040" cy="300" r="6" fill="#6366f1" class="node-pulse" />
    <circle cx="890" cy="350" r="5" fill="#3b82f6" />
    <circle cx="810" cy="120" r="5.5" fill="#c084fc" class="node-pulse" />
    <circle cx="680" cy="70" r="4.5" fill="#818cf8" />
  </g>

  <!-- FOREGROUND LAYER: Content & Typography (Sharp, High Z-Index, Unobstructed) -->
  <g class="floating-group">
    <!-- Top Category Pill -->
    <g transform="translate(425, 48)">
      <rect x="0" y="0" width="350" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="15" r="4" fill="#10b981" />
      <text x="32" y="19" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.5">DISTRIBUTED P2P &amp; BITTORRENT ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradient Fill + Drop Shadow) -->
    <text x="600" y="145" text-anchor="middle" font-size="44" font-weight="900" fill="url(#titleGrad)" filter="url(#textShadow)" letter-spacing="-0.5">
      AWESOME P2P &amp; BITTORRENT CLIENTS
    </text>

    <!-- Subtitle -->
    <text x="600" y="188" text-anchor="middle" font-size="16.5" font-weight="400" fill="#cbd5e1" filter="url(#textShadow)" letter-spacing="0.2">
      Curated Directory of Ad-Free Clients, High-Throughput Seedboxes &amp; Decentralized Swarms
    </text>

    <!-- Divider Line with Glow Accent -->
    <g transform="translate(350, 215)">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#334155" stroke-width="1.5" />
      <line x1="150" y1="0" x2="350" y2="0" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- Four Interactive Feature Badges / Metadata Pills -->
    <g transform="translate(140, 245)">
      <!-- Pill 1: High Throughput -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="205" height="42" rx="10" fill="url(#pillGrad)" stroke="#3b82f6" stroke-width="1.2" filter="url(#textShadow)" />
        <text x="20" y="26" font-size="13" font-weight="600" fill="#60a5fa">⚡ High-Throughput</text>
        <text x="145" y="26" font-size="11" font-weight="400" fill="#94a3b8">v1 &amp; v2</text>
      </g>

      <!-- Pill 2: 100% Ad-Free -->
      <g transform="translate(235, 0)">
        <rect x="0" y="0" width="215" height="42" rx="10" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1.2" filter="url(#textShadow)" />
        <text x="20" y="26" font-size="13" font-weight="600" fill="#34d399">🛡️ Ad-Free &amp; Pure</text>
        <text x="145" y="26" font-size="11" font-weight="400" fill="#94a3b8">No Spyware</text>
      </g>

      <!-- Pill 3: Headless & Daemon -->
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="205" height="42" rx="10" fill="url(#pillGrad)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#textShadow)" />
        <text x="20" y="26" font-size="13" font-weight="600" fill="#a78bfa">🚀 Headless Ready</text>
        <text x="145" y="26" font-size="11" font-weight="400" fill="#94a3b8">Seedboxes</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(715, 0)">
        <rect x="0" y="0" width="205" height="42" rx="10" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1.2" filter="url(#textShadow)" />
        <text x="20" y="26" font-size="13" font-weight="600" fill="#fbbf24">🌐 Peer Discovery</text>
        <text x="145" y="26" font-size="11" font-weight="400" fill="#94a3b8">DHT &amp; PEX</text>
      </g>
    </g>

    <!-- Bottom Secondary Info Line -->
    <g transform="translate(300, 320)">
      <text x="300" y="0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
        Cross-Platform Support: Windows • macOS • Linux • Docker • BSD • Android • Headless Daemons
      </text>
    </g>
  </g>
</svg>
